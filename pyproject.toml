[project]
name = "attractor-factory"
version = "0.1.0"
description = "StrongDM Attractor DOT-based Software Factory Engine & Operator Console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
